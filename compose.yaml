services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boardhere
      POSTGRES_USER: boardhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardhere_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - boardhere_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardhere -d boardhere"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  boardhere_pgdata:
