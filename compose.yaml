services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boardhere
      POSTGRES_USER: boardhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardhere_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - boardhere_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardhere -d boardhere"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://boardhere_api:boardhere_api_dev_only@db:5432/boardhere}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  boardhere_pgdata:
